# Einbetten (z. B. in Home Assistant): Das Backend nennt die erlaubten Adressen, sonst bleibt es verboten
map $bb_fa_raw $bb_frame_ancestors {
    ""      "'none'";
    default $bb_fa_raw;
}
map $bb_fa_raw $bb_xfo {
    ""      "DENY";
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Apple-Health-Export (mehrere GB): ohne Zwischenspeicherung durchreichen
    location = /api/imports/apple-health {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location ~ ^/api/(imports/files|ingest/) {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 1g;
        proxy_read_timeout 600s;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 60m;
        proxy_read_timeout 120s;
    }

    location = /_frame-policy {
        internal;
        proxy_pass http://backend:8000/api/frame-policy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location / {
        auth_request /_frame-policy;
        auth_request_set $bb_fa_raw $upstream_http_x_bb_frame_ancestors;
        include /etc/nginx/snippets/page-headers.conf;
        try_files $uri $uri/ /index.html;
        error_page 500 502 503 504 = @page_strict;
    }

    location @page_strict {
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
