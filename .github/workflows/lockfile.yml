name: package-lock.json aktualisieren

# Einmalig nach Änderungen an package.json von Hand: bringt die Sperrdatei auf Stand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [frontend/package.json, .github/workflows/lockfile.yml]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: cd frontend && npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --quiet && { echo "Sperrdatei schon aktuell"; exit 0; }
          git commit -m "package-lock.json passend zu package.json"
          git push
